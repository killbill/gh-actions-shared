name: CodeQL

env:
  MAVEN_OPTS: "-Xmx2G -XX:+ExitOnOutOfMemoryError -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3"

on:
  workflow_call:
    secrets:
      CLOUDSMITH_CENTRAL_PASSWORD:
        required: true
      CLOUDSMITH_KILLBILL_MAVEN_REPO_PASSWORD:
        required: true
    inputs:
      maven_args:
        description: The arguments to pass to all Maven commands when building the code
        required: false
        default: '-DskipTests=true -Dcheck.skip-dependency=true -Dcheck.skip-dependency-scope=true -Dcheck.skip-dependency-versions=true -Dcheck.skip-duplicate-finder=true -Dcheck.skip-enforcer=true -Dcheck.skip-rat=true -Dcheck.skip-spotbugs=true'
        type: string
      maven_version:
        description: The Maven version used for builds
        required: false
        default: '3.8.4'
        type: string
      os:
        description: The OS used
        required: false
        default: 'ubuntu-22.04'
        type: string
      jdk:
        description: The JDK used
        required: false
        default: '21'
        type: string
      jdk-distribution:
        description: The JDK distribution used
        required: false
        default: 'temurin'
        type: string
      timeout-minutes:
        description: 'timeout-minutes used by the builds (defaults to 360)'
        required: false
        default: 360
        type: number
      goal:
        description: The Maven goal(s) used
        required: false
        default: 'install'
        type: string
      failure-upload-path:
        description: A file, directory or wildcard pattern that describes what to upload on failure
        required: false
        type: string

jobs:
  analyze:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.jdk }}
          distribution: ${{ inputs.jdk-distribution }}
          cache: 'maven'
      - name: Configure Cloudsmith credentials
        uses: s4u/maven-settings-action@v4.0.0
        with:
          # CodeQL analysis workflow doesn't need "cloudsmith".
          servers: |
            [
              {"id": "central", "username": "-", "password": "${{ secrets.CLOUDSMITH_CENTRAL_PASSWORD }}"},
              {"id": "killbill-maven-repository", "username": "-", "password": "${{ secrets.CLOUDSMITH_KILLBILL_MAVEN_REPO_PASSWORD }}"},
              {"id": "github","configuration": {"httpHeaders": {"property": {"name": "Authorization","value": "Bearer ${{ secrets.GITHUB_TOKEN }}"}}}}
            ]
          repositories: |
            [
              {
                "id": "central", 
                "name": "Proxied Maven Central OSS repository at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/oss/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              },
              {
                "id": "killbill-maven-repository", 
                "name": "Proxy for most Kill Bill artifacts at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/killbill-maven-repository/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              }
            ]
          pluginRepositories: |
            [
              {
                "id": "central", 
                "name": "Proxy of Central OSS repository at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/oss/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              },
              {
                "id": "killbill-maven-repository", 
                "name": "Proxy for most Kill Bill artifacts at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/killbill-maven-repository/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              }
            ]
      - name: Set up Maven
        run: mvn --errors --batch-mode --show-version wrapper:wrapper "-Dmaven=${{ inputs.maven_version }}"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
      - name: Build code
        run: |
          ./mvnw --errors --batch-mode --show-version ${{ inputs.maven_args }} ${{ inputs.goal }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
